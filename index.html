<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毎日行動履歴</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style> /* 青色の文字はCSSのプロパティ */
        /* Noto Sans JP と Inter を適用 */
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* ★ 画面全体の高さを固定し、スクロールを内部で制御 */
            height: 100vh;
            overflow: hidden; /*　設定した高さ「100vh」から溢れたら隠すようにしている */
        }

        /* カスタムスタイル */
        .calendar-grid {
            /* 7列のグリッド */
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .calendar-day {
            /* 日付セルの最小の高さを設定 */
            min-height: 120px;
            /* セル内のフレックスコンテナ（日付番号と計画用） */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 評価ボタンのスタイル */
        .eval-radio:checked + label {
            transform: scale(1.1);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5); /* 青色のリング */
        }
        .eval-label {
            transition: all 0.2s ease-in-out;
        }
        
        /* 評価ごとの背景色（計画表示用） */
        .eval-4 { background-color: #dcfce7; } /* ◎ (緑系) - 変更 */
        .eval-3 { background-color: #bfdbfe; } /* 〇 (青系) - 変更 */
        .eval-2 { background-color: #fef08a; } /* △ (黄系) - 変更 */
        .eval-1 { background-color: #fecaca; } /* × (赤系) - 変更 */
        .eval-0 { background-color: #f3f4f6; } /* 未評価 */

        /* 評価ごとのボーダー色（デイリービュー用・タイムラインブロックの背景に転用） */
        .eval-day-4 { background-color: #dcfce7; border-left-color: #22c55e; } /* green - 変更 */
        .eval-day-3 { background-color: #bfdbfe; border-left-color: #3b82f6; } /* blue - 変更 */
        .eval-day-2 { background-color: #fef08a; border-left-color: #eab308; } /* yellow - 変更 */
        .eval-day-1 { background-color: #fecaca; border-left-color: #ef4444; } /* red - 変更 */
        .eval-day-0 { background-color: #f3f4f6; border-left-color: #d1d5db; } /* gray-light */

        /* 今日の日付をハイライト */
        .today {
            background-color: #e0f2fe; /* light-blue-100 */
        }
        .today .day-number {
            color: #0284c7; /* sky-700 */
            font-weight: 700;
        }

        /* ★ メインコンテナのスクロール制御 */
        .main-container {
            height: calc(100vh - 64px); /* ヘッダーの高さを引く (p-4 md:p-8 -> 64pxと仮定) */
            overflow-y: auto;
        }
        
        /* ★ デイリービューのタイムライン高さ */
        .timeline-container {
             /* (画面高さ - bodyパディング - ヘッダー - 終日 - フィードバック欄) で計算 */
             /* 64px(body-padding) + 85px(header) + 57px(allday) + 125px(feedback) = 331px */
             height: calc(100vh - 331px);
        }

        /* ★ スクロールバーを非表示にしつつスクロール可能にする (timeline-hours用) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <!-- ★ 月間ビューとデイリービューを切り替えるコンテナ -->
    <div id="app-container">

        <!-- 1. 月間ビュー -->
        <div id="month-view" class="max-w-7xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
            
            <!-- 1. カレンダーヘッダー (年月表示とナビゲーション) -->
            <header class="p-4 md:p-6 flex justify-between items-center border-b bg-gray-50">
                <button id="prev-month" class="p-2 rounded-full hover:bg-gray-200 transition duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <h2 id="current-month-year" class="text-xl md:text-2xl font-bold text-gray-800"></h2>
                <button id="next-month" class="p-2 rounded-full hover:bg-gray-200 transition duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </header>

            <!-- 2. カレンダー本体 (スクロールコンテナ) -->
            <div class="main-container">
                <!-- 曜日ヘッダー -->
                <div class="grid calendar-grid border-b sticky top-0 bg-white z-10">
                    <div class="text-center p-2 text-xs md:text-sm font-semibold text-red-600">日</div>
                    <div class="text-center p-2 text-xs md:text-sm font-semibold text-gray-700">月</div>
                    <div class="text-center p-2 text-xs md:text-sm font-semibold text-gray-700">火</div>
                    <div class="text-center p-2 text-xs md:text-sm font-semibold text-gray-700">水</div>
                    <div class="text-center p-2 text-xs md:text-sm font-semibold text-gray-700">木</div>
                    <div class="text-center p-2 text-xs md:text-sm font-semibold text-gray-700">金</div>
                    <div class="text-center p-2 text-xs md:text-sm font-semibold text-blue-600">土</div>
                </div>
                
                <!-- 日付グリッド (JavaScriptで生成) -->
                <div id="calendar-grid" class="grid calendar-grid">
                    <!-- 日付セルがここに入ります -->
                </div>
            </div>
        </div>

        <!-- 2. デイリービュー -->
        <!-- ★ レイアウトをタイムライン形式に変更 -->
        <div id="day-view" class="max-w-7xl mx-auto bg-white rounded-lg shadow-lg hidden h-full">
            <!-- デイリービュー・ヘッダー -->
            <header class="p-4 md:p-6 flex flex-col sm:flex-row justify-between items-center border-b bg-gray-50 space-y-3 sm:space-y-0">
                <button id="back-to-month" class="flex items-center p-2 rounded-lg hover:bg-gray-200 transition duration-200 self-start sm:self-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span class="ml-1 text-sm font-medium text-gray-700">月間へ戻る</span>
                </button>
                <h2 id="day-view-date" class="text-xl md:text-2xl font-bold text-gray-800 order-first sm:order-none"></h2>
                <button id="add-plan-day" class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200 shadow-sm flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    計画を追加
                </button>
            </header>
            
            <!-- 終日計画エリア -->
            <div class="flex border-b">
                <div class="w-20 md:w-24 border-r p-2 bg-gray-50 flex-shrink-0">
                    <div class="text-center text-xs md:text-sm font-medium text-gray-500 py-2 sticky top-0 bg-gray-50 z-10">終日</div>
                </div>
                <div id="day-all-day-list" class="flex-1 p-2 min-h-[50px] bg-gray-50 overflow-x-auto whitespace-nowrap space-x-2">
                    <!-- 時間指定のない計画がここに入る -->
                </div>
            </div>

            <!-- タイムラインコンテナ -->
            <div class="flex timeline-container">
                <!-- 時間軸 (左側) -->
                <div id="timeline-hours" class="w-20 md:w-24 border-r overflow-y-auto no-scrollbar flex-shrink-0">
                    <!-- JSで時間（0時～23時）を生成 -->
                </div>
                
                <!-- 計画エリア (右側) -->
                <div id="day-plans-list" class="flex-1 overflow-y-auto relative">
                    <!-- JSで時間軸の線（0時～23時）と計画ブロックを生成 -->
                </div>
            </div>

            <!-- ★ (新設) LLMフィードバック欄 -->
            <footer class="p-4 border-t bg-gray-50">
                <div class="flex justify-between items-center mb-2">
                    <h4 class="text-md font-semibold text-gray-800">一日のフィードバック</h4>
                    <button id="generate-feedback" class="px-3 py-1.5 bg-blue-500 text-white text-sm rounded-md hover:bg-blue-600 transition duration-200 shadow-sm disabled:opacity-50" aria-label="AIからのフィードバックを生成する">
                        フィードバックを生成
                    </button>
                </div>
                <div id="feedback-content" class="w-full h-24 p-2 border border-gray-300 rounded-md bg-white overflow-y-auto text-sm text-gray-700" aria-live="polite">
                    今日の計画を評価します。
                </div>
            </footer>
        </div> <!-- End #day-view -->

    </div> <!-- End #app-container -->


    <!-- 3. 計画入力・評価モーダル -->
    <div id="plan-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg overflow-hidden animate-fade-in">
            <form id="plan-form">
                <!-- モーダルヘッダー -->
                <header class="p-4 bg-blue-600 text-white flex justify-between items-center">
                    <h3 id="modal-date" class="text-lg font-semibold">計画の入力</h3>
                    <button type="button" id="close-modal" class="text-white hover:text-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </header>

                <!-- モーダルボディ -->
                <div class="p-6 space-y-6">
                    <!-- 計画ID（非表示） -->
                    <input type="hidden" id="plan-id">
                    <!-- 対象日付（非表示） -->
                    <input type="hidden" id="plan-date">

                    <!-- 計画内容 -->
                    <div>
                        <label for="plan-text" class="block text-sm font-medium text-gray-700 mb-1">計画内容</label>
                        <textarea id="plan-text" rows="3" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="例: 10ページ勉強する"></textarea>
                    </div>

                    <!-- ★ (新設) 終日チェックボックス -->
                    <div class="flex items-center">
                        <input type="checkbox" id="plan-all-day" name="plan-all-day" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <label for="plan-all-day" class="ml-2 block text-sm font-medium text-gray-900">終日</label>
                    </div>

                    <!-- ★ 時間入力 (divで囲み、selectに変更) -->
                    <div id="plan-time-inputs" class="grid grid-cols-2 gap-4">
                        <!-- 開始時刻 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">開始時刻</label>
                            <div class="flex space-x-2">
                                <select id="plan-start-hour" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    <!-- JSで 0-23時 を生成 -->
                                </select>
                                <select id="plan-start-minute" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    <!-- JSで 0-59分 を生成 -->
                                </select>
                            </div>
                        </div>
                        <!-- 終了時刻 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">終了時刻</label>
                            <div class="flex space-x-2">
                                <select id="plan-end-hour" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    <!-- JSで 0-23時 を生成 -->
                                </select>
                                <select id="plan-end-minute" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                    <!-- JSで 0-59分 を生成 -->
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 4段階評価 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">評価</label>
                        <div class="flex justify-around items-center">
                            <!-- 各評価ボタン -->
                            <div class="text-center">
                                <input type="radio" name="evaluation" id="eval-4" value="4" class="sr-only eval-radio">
                                <label for="eval-4" class="eval-label cursor-pointer p-3 rounded-full hover:bg-green-100 transition duration-200 block text-2xl md:text-3xl">◎</label>
                                <span class="text-xs text-gray-600">大変よい</span>
                            </div>
                            <div class="text-center">
                                <input type="radio" name="evaluation" id="eval-3" value="3" class="sr-only eval-radio">
                                <label for="eval-3" class="eval-label cursor-pointer p-3 rounded-full hover:bg-blue-100 transition duration-200 block text-2xl md:text-3xl">〇</label>
                                <span class="text-xs text-gray-600">よい</span>
                            </div>
                            <div class="text-center">
                                <input type="radio" name="evaluation" id="eval-2" value="2" class="sr-only eval-radio">
                                <label for="eval-2" class="eval-label cursor-pointer p-3 rounded-full hover:bg-yellow-100 transition duration-200 block text-2xl md:text-3xl">△</label>
                                <span class="text-xs text-gray-600">あと少し</span>
                            </div>
                            <div class="text-center">
                                <input type="radio" name="evaluation" id="eval-1" value="1" class="sr-only eval-radio">
                                <label for="eval-1" class="eval-label cursor-pointer p-3 rounded-full hover:bg-red-100 transition duration-200 block text-2xl md:text-3xl">×</label>
                                <span class="text-xs text-gray-600">要努力</span>
                            </div>
                        </div>
                    </div>

                    <!-- 理由 -->
                    <div>
                        <label for="plan-reason" class="block text-sm font-medium text-gray-700 mb-1">理由 (できた / できなかった理由)</label>
                        <textarea id="plan-reason" rows="3" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="例: 集中できたから / 時間が足りなかった"></textarea>
                    </div>
                </div>

                <!-- モーダルフッター -->
                <footer class="p-4 bg-gray-50 flex justify-end space-x-3">
                    <button type="button" id="delete-plan" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition duration-200 shadow-sm hidden">削除</button>
                    <button type="submit" id="save-plan" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200 shadow-sm">保存</button>
                </footer>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const calendarGrid = document.getElementById('calendar-grid');
            const currentMonthYear = document.getElementById('current-month-year');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');

            // ビュー関連
            const monthView = document.getElementById('month-view');
            const dayView = document.getElementById('day-view');
            const backToMonthBtn = document.getElementById('back-to-month');
            const dayViewDate = document.getElementById('day-view-date');
            const addPlanDayBtn = document.getElementById('add-plan-day');
            
            // ★ デイリービューのコンテナ変更
            const timelineHours = document.getElementById('timeline-hours'); // 時間軸
            const dayAllDayList = document.getElementById('day-all-day-list'); // 終日
            const dayPlansList = document.getElementById('day-plans-list'); // 時間指定計画
            
            // モーダル関連
            const modal = document.getElementById('plan-modal');
            const closeModalBtn = document.getElementById('close-modal');
            const planForm = document.getElementById('plan-form');
            const modalDate = document.getElementById('modal-date');
            const planIdInput = document.getElementById('plan-id');
            const planDateInput = document.getElementById('plan-date');
            const planTextInput = document.getElementById('plan-text');
            const planReasonInput = document.getElementById('plan-reason');
            // ★ 時間入力DOMの変更
            const planAllDayInput = document.getElementById('plan-all-day');
            const planTimeInputs = document.getElementById('plan-time-inputs');
            const planStartHour = document.getElementById('plan-start-hour');
            const planStartMinute = document.getElementById('plan-start-minute');
            const planEndHour = document.getElementById('plan-end-hour');
            const planEndMinute = document.getElementById('plan-end-minute');

            const savePlanBtn = document.getElementById('save-plan');
            const deletePlanBtn = document.getElementById('delete-plan');

            // 状態
            let currentDate = new Date();
            let plans = {}; // { 'YYYY-MM-DD': [{ id: '...', text: '...', evaluation: 0, reason: '', startTime: '', endTime: '' }, ...] }

            // ★ 時間軸の1時間あたりの高さ (ピクセル)
            const HOUR_HEIGHT_PX = 80;

            // 評価のマッピング (0: 未評価)
            const evalSymbols = { 0: '・', 1: '×', 2: '△', 3: '〇', 4: '◎' };
            const evalBgClasses = { 0: 'eval-0', 1: 'eval-1', 2: 'eval-2', 3: 'eval-3', 4: 'eval-4' };
            // ★ デイリービュー用のクラス（背景色 + 左ボーダー）
            const evalBorderClasses = { 0: 'eval-day-0', 1: 'eval-day-1', 2: 'eval-day-2', 3: 'eval-day-3', 4: 'eval-day-4' };

            // --- ストレージ ---
            function savePlans() {
                localStorage.setItem('calendarPlans', JSON.stringify(plans));
                // デイリービューが表示されている場合は、リストを再描画
                if (!dayView.classList.contains('hidden')) {
                    const currentDateString = planDateInput.value || dayViewDate.dataset.date;
                    if(currentDateString) {
                        showDayView(currentDateString);
                    }
                }
            }

            function loadPlans() {
                plans = JSON.parse(localStorage.getItem('calendarPlans')) || {};
            }

            // --- カレンダー描画 ---
            function renderCalendar() {
                calendarGrid.innerHTML = '';
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                currentMonthYear.textContent = `${year}年 ${month + 1}月`;

                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();
                const todayString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

                for (let i = 0; i < firstDayOfMonth; i++) {
                    calendarGrid.appendChild(createEmptyDayCell());
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    calendarGrid.appendChild(createDayCell(day, dateString, dateString === todayString));
                }
            }

            function createEmptyDayCell() {
                const cell = document.createElement('div');
                cell.className = 'calendar-day p-2 border-t border-r bg-gray-50';
                return cell;
            }

            function createDayCell(day, dateString, isToday) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day p-2 border-t border-r cursor-pointer hover:bg-gray-50 transition duration-150';
                if (isToday) {
                    cell.classList.add('today');
                }
                
                const dayNumber = document.createElement('span');
                dayNumber.className = 'day-number text-sm font-medium text-gray-800';
                dayNumber.textContent = day;
                cell.appendChild(dayNumber);

                const plansContainer = document.createElement('div');
                plansContainer.className = 'mt-1 space-y-1 overflow-y-auto max-h-20';
                
                const dayPlans = (plans[dateString] || []).sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
                dayPlans.forEach(plan => {
                    const planEl = createPlanElement(plan);
                    planEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openModal(dateString, plan.id);
                    });
                    plansContainer.appendChild(planEl);
                });
                cell.appendChild(plansContainer);
                
                const addBtn = document.createElement('button');
                addBtn.className = 'absolute bottom-1 right-1 p-1 rounded-full text-blue-500 hover:bg-blue-100 opacity-0 group-hover:opacity-100 transition-opacity';
                addBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>';
                addBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(dateString);
                });
                cell.classList.add('group');
                cell.appendChild(addBtn);

                cell.addEventListener('click', () => {
                    showDayView(dateString);
                });

                return cell;
            }

            function createPlanElement(plan) {
                const planEl = document.createElement('div');
                planEl.className = `p-1 rounded-md text-xs truncate ${evalBgClasses[plan.evaluation] || 'eval-0'}`;
                planEl.title = plan.text;
                
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'flex items-center space-x-1';
                
                const evalSymbol = document.createElement('span');
                evalSymbol.className = 'font-bold flex-shrink-0';
                evalSymbol.textContent = evalSymbols[plan.evaluation] || '・';
                contentWrapper.appendChild(evalSymbol);

                const planText = document.createElement('span');
                planText.className = 'truncate font-medium text-gray-800';
                
                let timePrefix = '';
                if (plan.startTime) {
                    timePrefix = `${plan.startTime} `;
                } else {
                    // ★ 終日の場合に「終日」と表示
                    timePrefix = '終日 ';
                }
                planText.textContent = timePrefix + (plan.text || '(タイトルなし)');
                
                contentWrapper.appendChild(planText);
                planEl.appendChild(contentWrapper);
                
                return planEl;
            }

            // --- ★ デイリービュー制御 (タイムライン) ---
            function showDayView(dateString) {
                monthView.classList.add('hidden');
                dayView.classList.remove('hidden');

                // 1. 日付ヘッダーを更新
                const date = new Date(dateString + 'T00:00:00');
                const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
                dayViewDate.textContent = new Intl.DateTimeFormat('ja-JP', options).format(date);
                dayViewDate.dataset.date = dateString;

                // 2. 「計画を追加」ボタンに日付をセット
                addPlanDayBtn.onclick = () => openModal(dateString);

                // 3. タイムラインのコンテナをクリア
                timelineHours.innerHTML = '';
                dayAllDayList.innerHTML = '';
                dayPlansList.innerHTML = '';

                // 4. 計画を「終日」と「時間指定」に分類
                const allDayPlans = [];
                const timedPlans = [];
                (plans[dateString] || []).forEach(plan => {
                    if (plan.startTime) {
                        timedPlans.push(plan);
                    } else {
                        allDayPlans.push(plan);
                    }
                });
                
                // 5. 時間軸（0時～23時）と背景の線を生成
                for (let hour = 0; hour < 24; hour++) {
                    // 左側の時間軸ラベル
                    const hourLabel = document.createElement('div');
                    hourLabel.className = 'h-[80px] text-right pr-2 text-xs font-medium text-gray-500 border-t pt-1';
                    hourLabel.style.height = `${HOUR_HEIGHT_PX}px`;
                    if (hour > 0) { // 0時は非表示
                        hourLabel.textContent = `${hour}:00`;
                    }
                    timelineHours.appendChild(hourLabel);

                    // 右側の背景線
                    const hourLine = document.createElement('div');
                    hourLine.className = 'h-[80px] border-t border-gray-200';
                    hourLine.style.height = `${HOUR_HEIGHT_PX}px`;
                    dayPlansList.appendChild(hourLine);
                }
                
                // スクロール同期 (時間軸と計画エリア)
                dayPlansList.onscroll = () => {
                    timelineHours.scrollTop = dayPlansList.scrollTop;
                };

                // 6. 終日計画を描画
                if (allDayPlans.length === 0) {
                    dayAllDayList.innerHTML = '<span class="text-sm text-gray-400 italic px-2">終日の計画はありません</span>';
                } else {
                    allDayPlans.forEach(plan => {
                        dayAllDayList.appendChild(createAllDayPlanElement(plan, dateString));
                    });
                }

                // 7. 時間指定計画を描画 (Absolute配置)
                timedPlans.forEach(plan => {
                    dayPlansList.appendChild(createDayPlanBlockElement(plan, dateString));
                });

                // 8. (オプション) スクロール位置の調整
                const now = new Date();
                if (dateString === `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`) {
                    // 今日の場合は現在時刻へ
                    const currentTop = (now.getHours() * HOUR_HEIGHT_PX) + (now.getMinutes() / 60 * HOUR_HEIGHT_PX);
                    dayPlansList.scrollTop = currentTop - (dayPlansList.clientHeight / 4); // 画面の1/4くらいの位置に
                } else {
                    // または、最初の予定にスクロール (ソート)
                    const sortedPlans = timedPlans.sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
                    if(sortedPlans.length > 0) {
                        const firstPlanTop = parseTimeToMinutes(sortedPlans[0].startTime) / 60 * HOUR_HEIGHT_PX;
                        dayPlansList.scrollTop = firstPlanTop - 20; // 少し上
                    } else {
                        dayPlansList.scrollTop = 8 * HOUR_HEIGHT_PX; // デフォルトで午前8時に
                    }
                }
            }

            // ★ 時間文字列 (HH:MM) を分数 (0〜1439) に変換
            function parseTimeToMinutes(timeStr) {
                if (!timeStr) return 0;
                const parts = timeStr.split(':');
                if (parts.length < 2) return 0;
                const [hours, minutes] = parts.map(Number);
                return (hours * 60) + (minutes || 0);
            }

            // ★ (新設) 終日計画の要素を作成
            function createAllDayPlanElement(plan, dateString) {
                const item = document.createElement('div');
                item.className = `p-1.5 rounded-md text-sm truncate cursor-pointer mr-2 inline-block ${evalBgClasses[plan.evaluation] || 'eval-0'}`;
                item.textContent = plan.text || '(タイトルなし)';
                item.title = plan.text;
                item.addEventListener('click', () => openModal(dateString, plan.id));
                return item;
            }

            // ★ (旧 createDayPlanElement を改造) 時間指定計画のブロック要素を作成
            function createDayPlanBlockElement(plan, dateString) {
                const item = document.createElement('div');
                
                const startTime = plan.startTime; // "09:00"
                // 終了時間がない場合は、デフォルトで1時間とする
                const endTime = plan.endTime || (startTime ? `${String(parseInt(startTime.split(':')[0]) + 1).padStart(2, '0')}:${startTime.split(':')[1]}` : null);

                if (!startTime || !endTime) return item; // 時間が不正なら表示しない

                const startMinutes = parseTimeToMinutes(startTime);
                let endMinutes = parseTimeToMinutes(endTime);
                
                // 終了が開始より早い場合 (例: 10:00 - 09:00)、または同じ場合は、最低30分確保
                if (endMinutes <= startMinutes) {
                    endMinutes = startMinutes + 30;
                }
                
                let durationMinutes = endMinutes - startMinutes;
                
                // 1分あたりの高さを計算
                const MINUTE_HEIGHT_PX = HOUR_HEIGHT_PX / 60;
                
                const top = startMinutes * MINUTE_HEIGHT_PX;
                let height = durationMinutes * MINUTE_HEIGHT_PX;
                
                // 最小の高さを設定 (例: 15分)
                if (height < MINUTE_HEIGHT_PX * 15) {
                    height = MINUTE_HEIGHT_PX * 15;
                }
                
                // 24時を超える場合は丸める
                if ((top + height) > (24 * 60 * MINUTE_HEIGHT_PX)) {
                    height = (24 * 60 * MINUTE_HEIGHT_PX) - top;
                }


                item.className = `absolute left-2 right-2 p-2 rounded-lg shadow-sm cursor-pointer flex flex-col overflow-hidden border-l-4 ${evalBorderClasses[plan.evaluation] || 'eval-day-0'}`;
                
                // ★ ここから修正 (構文エラーの修正)
                item.style.top = `${top}px`;
                item.style.height = `${height}px`;
                item.style.zIndex = '10'; // 重なり順
                
                // クリックでモーダルを開く
                item.addEventListener('click', () => openModal(dateString, plan.id));

                // テキスト内容
                const timeText = document.createElement('p');
                timeText.className = 'text-xs font-bold text-gray-700';
                timeText.textContent = `${startTime} - ${endTime}`;
                item.appendChild(timeText);

                const planText = document.createElement('p');
                planText.className = 'text-sm font-medium text-gray-900 mt-1';
                planText.textContent = plan.text || '(タイトルなし)';
                item.appendChild(planText);
                
                // 高さがある場合のみ理由を表示
                if (height > 40 && plan.reason) {
                    const reasonText = document.createElement('p');
                    reasonText.className = 'text-xs text-gray-600 mt-1 italic overflow-hidden';
                    reasonText.textContent = plan.reason;
                    item.appendChild(reasonText);
                }

                return item;
            } 
            // ★ ここまで修正

            // ★ (新設) 時間選択プルダウンを生成する
            function populateTimeSelects() {
                // 時 (0-23)
                for (let i = 0; i <= 23; i++) {
                    const hour = String(i);
                    const optionStart = new Option(`${hour}`, hour);
                    const optionEnd = new Option(`${hour}`, hour);
                    planStartHour.appendChild(optionStart);
                    planEndHour.appendChild(optionEnd);
                }
                // 分 (0-59)
                for (let i = 0; i <= 55; i+= 5) {
                    const minute = String(i).padStart(2, '0');
                    const optionStart = new Option(`${minute}`, minute);
                    const optionEnd = new Option(`${minute}`, minute);
                    planStartMinute.appendChild(optionStart);
                    planEndMinute.appendChild(optionEnd);
                }
            }

            // ★ (新設) 終日チェックボックスのイベントリスナー
            planAllDayInput.addEventListener('change', () => {
                if (planAllDayInput.checked) {
                    planTimeInputs.classList.add('hidden');
                } else {
                    planTimeInputs.classList.remove('hidden');
                }
            });


            // 月間ビューに戻る
            backToMonthBtn.addEventListener('click', () => {
                dayView.classList.add('hidden');
                monthView.classList.remove('hidden');
                renderCalendar(); // 変更が反映されるように再描画
            });

            // --- モーダル制御 ---
            function openModal(dateString, planId = null) {
                // フォームをリセット
                planForm.reset();
                planTextInput.value = '';
                planReasonInput.value = '';
                planIdInput.value = '';
                // ★ 時間入力のリセット
                planAllDayInput.checked = false;
                planTimeInputs.classList.remove('hidden');
                planStartHour.value = '09'; // デフォルト 9時
                planStartMinute.value = '00';
                planEndHour.value = '10'; // デフォルト 10時
                planEndMinute.value = '00';
                
                deletePlanBtn.classList.add('hidden');
                
                // 日付をセット
                planDateInput.value = dateString;
                const date = new Date(dateString + 'T00:00:00');
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                modalDate.textContent = `${new Intl.DateTimeFormat('ja-JP', options).format(date)} の計画`;

                // 既存の計画データをロード
                if (planId) {
                    const plan = (plans[dateString] || []).find(p => p.id === planId);
                    if (plan) {
                        planIdInput.value = plan.id;
                        planTextInput.value = plan.text;
                        planReasonInput.value = plan.reason || '';
                        
                        // ★ 時間と終日の設定
                        if (plan.startTime) {
                            // 時間指定がある場合
                            planAllDayInput.checked = false;
                            planTimeInputs.classList.remove('hidden');
                            
                            const [startH = '09', startM = '00'] = (plan.startTime || '09:00').split(':');
                            const [endH = '10', endM = '00'] = (plan.endTime || '10:00').split(':');
                            
                            planStartHour.value = startH.padStart(2, '0');
                            planStartMinute.value = startM.padStart(2, '0');
                            planEndHour.value = endH.padStart(2, '0');
                            planEndMinute.value = endM.padStart(2, '0');

                        } else {
                            // 終日の場合
                            planAllDayInput.checked = true;
                            planTimeInputs.classList.add('hidden');
                        }

                        if (plan.evaluation) {
                            const radio = document.getElementById(`eval-${plan.evaluation}`);
                            if (radio) radio.checked = true;
                        }
                        deletePlanBtn.classList.remove('hidden');
                    }
                }
                
                modal.classList.remove('hidden');
            }

            function closeModal() {
                modal.classList.add('hidden');
                planForm.reset(); // フォーム要素をリセット
                
                // ★ ここから修正 (モーダルを閉じる際の明示的なリセット)
                planIdInput.value = '';
                
                // 終日チェックと時間をデフォルトに戻す
                planAllDayInput.checked = false;
                planTimeInputs.classList.remove('hidden');
                planStartHour.value = '09';
                planStartMinute.value = '00';
                planEndHour.value = '10';
                planEndMinute.value = '00';

                deletePlanBtn.classList.add('hidden');
                // ★ ここまで修正 (古い planStartTimeInput などの参照を削除)
            }

            closeModalBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });

            // --- フォーム操作 ---
            planForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const dateString = planDateInput.value;
                if (!dateString) {
                    console.error('対象の日付がありません。');
                    return;
                }

                const id = planIdInput.value || `plan-${new Date().getTime()}`;
                const text = planTextInput.value.trim();
                const reason = planReasonInput.value.trim();
                
                // ★ 時間の取得
                let startTime = "";
                let endTime = "";
                if (!planAllDayInput.checked) {
                    // 終日チェックがない場合のみ時間を取得
                    startTime = `${planStartHour.value}:${planStartMinute.value}`;
                    endTime = `${planEndHour.value}:${planEndMinute.value}`;
                }
                
                const evaluationRadio = planForm.querySelector('input[name="evaluation"]:checked');
                const evaluation = evaluationRadio ? parseInt(evaluationRadio.value, 10) : 0;

                if (!text) {
                    // alert('計画内容を入力してください。'); // カスタムUI推奨
                    planTextInput.focus();
                    return;
                }


                if (!plans[dateString]) {
                    plans[dateString] = [];
                }

                const planIndex = plans[dateString].findIndex(p => p.id === id);
                const planData = { id, text, evaluation, reason, startTime, endTime };

                if (planIndex > -1) {
                    plans[dateString][planIndex] = planData;
                } else {
                    plans[dateString].push(planData);
                }

                savePlans();
                // renderCalendar(); // 月間ビューの再描画は戻るときだけで良いかも
                closeModal();
            });

            // 計画の削除
            deletePlanBtn.addEventListener('click', () => {
                const dateString = planDateInput.value;
                const id = planIdInput.value;

                if (!id || !plans[dateString]) return;

                // 削除確認 (window.confirmは避けるべきだが、簡易的に実装)
                // 簡易的なカスタム確認モーダルを推奨
                // if (confirm('この計画を削除しますか？')) {
                    plans[dateString] = plans[dateString].filter(p => p.id !== id);
                    if (plans[dateString].length === 0) {
                        delete plans[dateString];
                    }
                    
                    savePlans();
                    // renderCalendar();
                    closeModal();
                // }
            });

            // 月移動
            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

Examples:

            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            // ★ (新設) LLMフィードバック生成機能
            const generateFeedbackBtn = document.getElementById('generate-feedback');
            const feedbackContent = document.getElementById('feedback-content');

            generateFeedbackBtn.addEventListener('click', async () => {
                const dateString = dayViewDate.dataset.date;
                if (!dateString) {
                    feedbackContent.textContent = '日付が選択されていません。';
                    return;
                }

                const dailyPlans = plans[dateString] || [];
                if (dailyPlans.length === 0) {
                    feedbackContent.textContent = 'フィードバック対象の計画がありません。';
                    return;
                }

                feedbackContent.textContent = 'AIがフィードバックを生成中です...';
                generateFeedbackBtn.disabled = true;

                // 計画データをテキストに整形
                const planDetails = dailyPlans.map(plan => {
                    const time = plan.startTime ? `${plan.startTime}-${plan.endTime || '?'}` : '終日';
                    const evalText = evalSymbols[plan.evaluation] || '未評価';
                    const reason = plan.reason ? `理由: ${plan.reason}` : '';
                    return `- ${time}「${plan.text}」 (評価: ${evalText}) ${reason}`;
                }).join('\n');

                const userQuery = `
以下の計画と自己評価に基づき、学習やタスク管理のアドバイザーとして、良かった点と改善点を具体的にフィードバックしてください。
結果は日本語の簡潔な単一のパラグラフで返してください。

日付: ${dateString}
計画リスト:
${planDetails}
`;

                try {
                    const feedbackText = await callGeminiApi(userQuery);
                    feedbackContent.textContent = feedbackText;
                } catch (error) {
                    // console.error('Gemini API Error:', error); // デバッグ用
                    feedbackContent.textContent = 'フィードバックの生成に失敗しました。時間をおいて再試行してください。';
                } finally {
                    generateFeedbackBtn.disabled = false;
                }
            });

            // ★ (新設) Gemini API 呼び出し関数
            async function callGeminiApi(userQuery) {
                const apiKey = ""; // APIキーは空のままにします
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: {
                        parts: [{ text: "あなたは、利用者の計画達成をサポートする、ポジティブで建設的なフィードバックを行うAIコーチです。具体的で実行可能なアドバイスを心がけてください。" }]
                    },
                };

                // 指数関数的バックオフ（簡易版）
                let response;
                let delay = 1000;
                for (let i = 0; i < 3; i++) { // 最大3回リトライ
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            break; //  succes
                        }
                        if (response.status === 429) { // スロットリング
                            await new Promise(resolve => setTimeout(resolve, delay));
                            delay *= 2;
                        } else {
                            throw new Error(`API Error: ${response.statusText}`);
                        }
                    } catch (error) {
                        if (i === 2) throw error; // 最後の試行でエラー
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    }
                }
                
                if (!response || !response.ok) {
                    throw new Error('API request failed after retries.');
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    return candidate.content.parts[0].text;
                } else {
                    // 予期しないレスポンス構造の場合
                    if (result.promptFeedback) {
                        // console.error("Prompt Feedback:", result.promptFeedback);
                        throw new Error('Content generation blocked.');
                    }
                    throw new Error('Valid response text not found.');
                }
            }


            // --- 初期化 ---
            loadPlans();
            populateTimeSelects(); // ★ 時間選択を初期化
            renderCalendar();
        });

        // モーダル表示用のアニメーション
        const styleSheet = document.createElement("style");
        styleSheet.type = "text/css";
        styleSheet.innerText = `
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.95); }
                to { opacity: 1; transform: scale(1); }
            }
            .animate-fade-in {
                animation: fadeIn 0.2s ease-out;
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
